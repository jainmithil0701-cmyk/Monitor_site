# Render gives the port through the PORT environment variable
server.port=${PORT:8080}

# Database: uses Render PostgreSQL when DB_URL is set, otherwise a local in-memory H2 database
spring.datasource.url=${DB_URL:jdbc:h2:mem:siteguard;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Monitoring settings
siteguard.interval-ms=60000
# Optional: Discord/Slack-style webhook URL for DOWN / RECOVERED alerts
siteguard.webhook-url=${ALERT_WEBHOOK_URL:}
